spring:
  application:
    name: chatbot

  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB